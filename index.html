<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a241a" />
    <!-- Keep search engines out while the site is behind its password page. Delete this line at launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Small-batch cold brew coffee, steeped for eighteen hours and bottled by hand. Order with Venmo and pick it up locally in Jersey Village, Texas."
    />
    <title>Withner Coffee Co. | Family-Made Cold Brew</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify finds forms by reading the built HTML, and the real contact form is drawn by React,
         so this hidden copy tells Netlify the form exists. Keep its field names in step with
         src/components/Contact.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
